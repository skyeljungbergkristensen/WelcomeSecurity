#baseurl: ''
baseurl: "/WelcomeSecurity/"
permalink: pretty
title: 'Sustira - ESG og bæredygtighed for virksomheder'
description: >
  Sustira hjælper virksomheder med ESG-rapportering, CO₂-kortlægning og LCA (livscyklusvurdering).
  Vi gør bæredygtighed overskueligt og anvendeligt - fra data til handling, så I kan træffe
  bedre beslutninger, styrke troværdigheden og drive cirkulær økonomi i praksis.
author: 'Sustira'
keywords: >
  ESG, ESG-rapportering, bæredygtighed, LCA, livscyklusvurdering, CO₂-kortlægning,
  klimaregnskab, scope 1, scope 2, scope 3, cirkulær økonomi, miljøpåvirkning,
  bæredygtig udvikling, grøn omstilling, CSR, miljøledelse, produktudvikling,
  cradle-to-gate, cradle-to-grave, miljøaftryk, Silkeborg, Jylland, Danmark

destination: output

logo:
  mobile: "images/logo/logo mobile.webp"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo.webp"
  desktop_height: "32px"
  desktop_width: "120px"

home: 
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed

# Security settings
safe: true
highlighter: rouge
markdown: kramdown

# SEO settings
url: "https://www.sustira.dk"
lang: da-DK

# Explicitly include dotfiles for security headers and well-known
include:
  - .htaccess
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
